            <stop offset="0%" stop-color="#000666" />
            <stop offset="100%" stop-color="#1a237e" />
        </linearGradient>
    </defs>
    <rect width="512" height="512" rx="120" fill="url(#primaryGrad)" />
    
    <!-- Open Book Left Page -->
    <path d="M 256 384 C 200 384 128 350 128 350 L 128 200 C 128 200 200 230 256 256 Z" fill="#ffffff" />
    <!-- Open Book Right Page -->
    <path d="M 256 384 C 312 384 384 350 384 350 L 384 200 C 384 200 312 230 256 256 Z" fill="#e0e0ff" />
    
    <!-- Cap Base -->
    <polygon points="170,195 256,245 342,195 342,230 256,280 170,230" fill="#bdc2ff" />
    <!-- Graduation Cap Diamond -->
    <polygon points="256,100 128,170 256,240 384,170" fill="#ffffff" />
    
    <!-- Tassel String -->
    <line x1="384" y1="170" x2="384" y2="280" stroke="#ffffff" stroke-width="16" />
    <!-- Tassel End -->
    <circle cx="384" cy="280" r="24" fill="#ffd54f" />
